<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="CampusConnect college event discovery and registration portal"><title>Manage Events | CampusConnect</title><link rel="stylesheet" href="../style.css"></head><body><main class="page"><div class="admin-shell"><aside class="sidebar"><a class="brand" href="admin-dashboard.html">CampusConnect</a><a href="admin-dashboard.html">▦ Dashboard</a><a href="admin-events.html">✦ Manage Events</a><a href="admin-registrations.html">▤ Registrations</a><a href="admin-messages.html">✉ Messages</a><a href="#" id="logout">↪ Logout</a></aside><section class="admin-content" data-admin-page="events"><div class="breadcrumb">Admin / Manage Events</div><div class="eyebrow">Content management</div><h1>Manage Events</h1><p class="muted">Add a new event and review the event list.</p><div class="panel"><h2>Add Event</h2><form id="add-event-form"><div class="field-line"><div class="form-row"><label>Event name</label><input name="name" required></div><div class="form-row"><label>Category</label><select name="category"><option>Technology</option><option>Design</option><option>Cultural</option><option>Business</option><option>Sports</option></select></div></div><div class="field-line"><div class="form-row"><label>Date</label><input type="date" name="date" required></div><div class="form-row"><label>Time</label><input type="time" name="time" required></div></div><div class="field-line"><div class="form-row"><label>Venue</label><input name="venue" required></div><div class="form-row"><label>Seats</label><input type="number" name="seats" min="1" value="50" required></div></div><div class="form-row"><label>Description</label><textarea name="description" required></textarea></div><button class="btn">Add event</button></form></div><div class="section-head"><h2>Event list</h2></div><div class="table-wrap"><table><thead><tr><th>Event</th><th>Category</th><th>Date</th><th>Action</th></tr></thead><tbody id="admin-event-list"></tbody></table></div></section></div></main><script src="../script.js"></script></body></html>
